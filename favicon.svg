<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Keyboard Master">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="none" stroke="#000" stroke-opacity=".15"/>
  <g fill="#fff">
    <!-- Monogram K to represent Keyboard -->
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-family="system-ui, Arial, sans-serif" font-weight="800" font-size="34">K</text>
  </g>
</svg>
